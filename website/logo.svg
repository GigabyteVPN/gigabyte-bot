<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Gigabyte VPN">
  <defs>
    <linearGradient id="gbFill" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="gbGloss" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Скруглённый квадрат в пропорциях иконки приложения: сайт и мини-апп
       должны читаться как один продукт. -->
  <rect width="100" height="100" rx="23" fill="url(#gbFill)"/>
  <rect width="100" height="100" rx="23" fill="url(#gbGloss)"/>
  <!-- Монограмма G: разомкнутое кольцо с перекладиной -->
  <path d="M68.4 31.6A26 26 0 1 0 76 50H56"
        fill="none" stroke="#fff" stroke-width="10.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
