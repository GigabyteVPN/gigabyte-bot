<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, follow">
<title>Страница не найдена — Gigabyte VPN</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Gigabyte VPN — оформление сайта в эстетике iOS.

   Правила, на которых всё держится:
   1. Контент виден всегда. Ни один блок не имеет opacity:0 в обычном
      состоянии — сайт дважды уходил в чёрный экран, когда показ зависел
      от чего-то асинхронного. Появление осталось только на первом экране
      и привязано ко времени, то есть гарантированно доигрывает.
   2. Размеры текучие (clamp / auto-fit): от 320px до 4K без ступенек
      и без горизонтальной прокрутки.
   3. Ничего внешнего: шрифты системные, графика — inline SVG. Это держит
      строгую политику безопасности и убирает лишние запросы.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;

  /* Системная палитра тёмной темы iOS */
  --bg:#000000;
  --card:#1C1C1E;
  --card-2:#2C2C2E;
  --card-3:#3A3A3C;
  --sep:rgba(84,84,88,.55);
  --hair:rgba(255,255,255,.07);

  --txt:#FFFFFF;
  --txt-2:rgba(235,235,245,.62);
  --txt-3:rgba(235,235,245,.55);

  --blue:#0A84FF;
  --indigo:#5E5CE6;
  --green:#30D158;
  --orange:#FF9F0A;
  --pink:#FF375F;
  --teal:#40C8E0;

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* Скругления в пропорциях iOS */
  --r-card:22px;
  --r-lg:28px;
  --r-xl:36px;
  --pill:999px;

  --maxw:1080px;
  --pad:clamp(16px,4.4vw,28px);
  --sec:clamp(64px,9vw,132px);
  --nav-h:52px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{
  background:var(--bg);
  min-height:100%;
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--sans);
  font-size:clamp(16px,.35vw + 15.2px,17px);
  line-height:1.47;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-height:100dvh;
  overflow-x:clip;
}
body.lock{overflow:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px;border:2px solid transparent;background-clip:content-box}

/* Видимый фокус с клавиатуры — без него сайт непроходим без мыши */
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(10,132,255,.45);border-radius:12px}

.wrap{max-width:var(--maxw);margin-inline:auto;position:relative;z-index:2;
  padding-inline:max(var(--pad),env(safe-area-inset-left),env(safe-area-inset-right))}
section{padding-block:var(--sec);position:relative;scroll-margin-top:calc(var(--nav-h) + 14px)}

/* ── Типографика в духе Apple: крупно, плотно, по центру ── */
h1,h2,h3{font-weight:700;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.6rem,8.4vw,5rem)}
h2{font-size:clamp(2rem,5.6vw,3.4rem)}
h3{font-size:clamp(1.1rem,1.4vw + .8rem,1.35rem);letter-spacing:-.022em;line-height:1.25}
p{text-wrap:pretty}

.eyebrow{display:block;font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:600;letter-spacing:-.01em;
  background:linear-gradient(96deg,var(--blue),var(--indigo));-webkit-background-clip:text;background-clip:text;
  color:transparent;margin-bottom:12px}
.lead{color:var(--txt-2);font-size:clamp(1.05rem,.7vw + .92rem,1.32rem);line-height:1.4;max-width:34ch}
.sec-head{text-align:center;max-width:min(720px,100%);margin:0 auto clamp(36px,5vw,64px)}
.sec-head .lead{margin-inline:auto;max-width:44ch}
.sec-head h2{margin-bottom:16px}
.grad{background:linear-gradient(96deg,var(--blue),var(--indigo) 55%,var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-inline-end:.05em}

/* ── Кнопки iOS: сплошная синяя «пилюля» и приглушённая вторичная ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:clamp(1rem,.25vw + .95rem,1.06rem);font-weight:590;letter-spacing:-.015em;
  min-height:52px;padding:15px 30px;border-radius:var(--pill);cursor:pointer;white-space:nowrap;
  transition:transform .2s cubic-bezier(.2,.7,.3,1),background-color .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.b-main{background:var(--blue);color:#fff}
.b-main:hover{background:#3D9BFF}
.b-ghost{background:var(--card-2);color:var(--txt)}
.b-ghost:hover{background:var(--card-3)}
.btn svg{width:19px;height:19px;flex:0 0 auto}

/* ── Панель навигации: размытая, с волосяной линией снизу ── */
header.nav{position:fixed;top:0;left:0;right:0;z-index:90;padding-top:env(safe-area-inset-top);
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid transparent;transition:border-color .3s}
header.nav.on{border-bottom-color:var(--sep)}
.nav-in{max-width:var(--maxw);margin-inline:auto;min-height:var(--nav-h);
  padding:8px max(var(--pad),env(safe-area-inset-right)) 8px max(var(--pad),env(safe-area-inset-left));
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:1.06rem;font-weight:600;letter-spacing:-.022em;
  padding-block:6px;flex:0 0 auto}
.brand img{width:28px;height:28px;border-radius:7px}
.nav-l{display:flex;gap:2px;min-width:0}
.nav-l a{font-size:.88rem;color:var(--txt-2);padding:8px 12px;border-radius:9px;font-weight:450;
  min-height:38px;display:inline-flex;align-items:center;white-space:nowrap;transition:color .2s}
.nav-l a:hover{color:var(--txt)}
.nav-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}

/* Сегментированный переключатель языка — как в системных настройках */
.seg{display:flex;background:var(--card-2);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:8px 12px;border-radius:7px;font-size:.78rem;font-weight:590;color:var(--txt-2);
  cursor:pointer;min-height:36px;transition:background-color .2s,color .2s}
.seg button.on{background:var(--card-3);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.nav-r .btn{min-height:38px;padding:9px 19px;font-size:.92rem}

.burger{display:none;width:40px;height:40px;border-radius:11px;background:var(--card-2);
  cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4.5px}
.burger span{width:17px;height:1.7px;background:var(--txt);border-radius:2px}

.mob{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  gap:6px;padding:calc(env(safe-area-inset-top) + 78px) var(--pad) calc(env(safe-area-inset-bottom) + 24px);
  overflow-y:auto;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .3s}
.mob.open{visibility:visible;opacity:1;transition-delay:0s}
.mob a:not(.btn){font-size:1.2rem;font-weight:590;letter-spacing:-.02em;padding:15px 20px;
  border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:space-between}
.mob a:not(.btn)::after{content:"";width:7px;height:7px;border-right:2px solid var(--txt-3);
  border-bottom:2px solid var(--txt-3);transform:rotate(-45deg)}
.mob .btn{margin-top:14px}
.mob .x{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:var(--pad);
  width:40px;height:40px;border-radius:50%;background:var(--card-2);color:var(--txt);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer}

/* ── Первый экран ── */
.hero{padding-top:calc(var(--nav-h) + env(safe-area-inset-top) + clamp(52px,11vh,104px));
  padding-bottom:clamp(20px,4vw,44px);text-align:center}
.hero h1{margin-bottom:clamp(16px,2.2vw,24px)}
.hero .lead{margin:0 auto;max-width:36ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:clamp(26px,3.4vw,36px)}
.hero-note{margin-top:18px;font-size:.88rem;color:var(--txt-3)}

/* Макет телефона: показываем сам продукт, а не абстракции */
.device-wrap{display:flex;justify-content:center;padding-bottom:var(--sec);
  padding-inline:max(var(--pad),env(safe-area-inset-left))}
.device{width:min(300px,78vw);aspect-ratio:9/19.5;border-radius:min(46px,12vw);padding:10px;
  background:linear-gradient(160deg,#3A3A3C,#1C1C1E 40%,#2C2C2E);
  box-shadow:0 50px 100px -40px rgba(10,132,255,.5),0 0 0 .5px rgba(255,255,255,.14);
  position:relative}
.screen{width:100%;height:100%;border-radius:min(37px,9.4vw);overflow:hidden;position:relative;
  background:radial-gradient(120% 80% at 50% 0%,#12233F,#000 62%);
  display:flex;flex-direction:column;gap:9px;padding:34px 13px 16px}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:34%;height:19px;
  background:#000;border-radius:99px;z-index:2}
.s-row{background:rgba(255,255,255,.08);border-radius:13px;padding:10px 12px;
  display:flex;align-items:center;gap:9px}
.s-row .ic{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(160deg,var(--blue),var(--indigo));display:flex;align-items:center;justify-content:center}
.s-row .ic svg{width:14px;height:14px;color:#fff}
.s-line{height:6px;border-radius:99px;background:rgba(255,255,255,.22)}
.s-line.s{width:52%}
.s-line.m{width:72%}
.s-col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.s-hero{background:linear-gradient(150deg,var(--blue),var(--indigo));border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:7px}
.s-hero .big{font-size:20px;font-weight:700;letter-spacing:-.03em}
.s-hero .sm{font-size:10.5px;opacity:.85}
.s-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}

/* ── Сгруппированные списки — основа интерфейса iOS ── */
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
.row .ic{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.row .ic svg{width:18px;height:18px;color:#fff}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:1rem;font-weight:510;letter-spacing:-.018em}
.row .tx span{display:block;font-size:.88rem;color:var(--txt-2);margin-top:2px;line-height:1.35}
.row .val{font-size:.92rem;color:var(--txt-3);white-space:nowrap;flex:0 0 auto}
.chev{width:8px;height:8px;border-right:2px solid var(--txt-3);border-bottom:2px solid var(--txt-3);
  transform:rotate(-45deg);flex:0 0 auto;margin-left:2px}
.group-title{font-size:.8rem;font-weight:590;letter-spacing:.02em;text-transform:uppercase;
  color:var(--txt-3);margin:0 0 9px 18px}

/* Цвета значков — как у системных иконок настроек */
.i-blue{background:var(--blue)}.i-indigo{background:var(--indigo)}.i-green{background:var(--green)}
.i-orange{background:var(--orange)}.i-pink{background:var(--pink)}.i-teal{background:var(--teal)}
.i-gray{background:var(--card-3)}

/* ── Крупные карточки возможностей ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,286px),1fr));gap:clamp(12px,1.4vw,18px)}
.tile{background:var(--card);border-radius:var(--r-lg);padding:clamp(24px,2.6vw,32px);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  transition:transform .32s cubic-bezier(.2,.7,.3,1),background-color .32s}
.tile::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(10,132,255,.18),transparent 62%)}
.tile:hover{transform:translateY(-4px);background:#202022}
.tile:hover::before{opacity:1}
.tile .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.tile .ic svg{width:24px;height:24px;color:#fff}
.tile h3{margin-bottom:9px}
.tile p{color:var(--txt-2);font-size:.97rem;line-height:1.45}
.tile .note{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:.74rem;color:var(--txt-3);
  overflow-wrap:anywhere}

/* ── Схема маршрутизации ── */
.route{background:var(--card);border-radius:var(--r-lg);padding:clamp(22px,3vw,36px);
  display:flex;flex-direction:column;gap:14px}
.path{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.node{background:var(--card-2);border-radius:var(--pill);padding:10px 17px;font-size:.9rem;font-weight:500}
.node.hi{background:rgba(10,132,255,.18);color:#6FB6FF}
.node.ru{background:rgba(48,209,88,.16);color:#5EE07E}
.arrow{color:var(--txt-3);flex:0 0 auto;font-size:.95rem}
.route p{color:var(--txt-2);font-size:.95rem;margin-top:6px}

/* ── Тарифы ── */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,214px),1fr));gap:clamp(12px,1.4vw,16px)}
.plan{background:var(--card);border-radius:var(--r-lg);padding:26px 22px 22px;position:relative;
  display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.plan:hover{transform:translateY(-4px)}
.plan.best{background:linear-gradient(165deg,rgba(10,132,255,.2),var(--card) 62%);
  box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.55)}
.plan .tag{position:absolute;top:14px;right:14px;background:var(--blue);color:#fff;
  font-size:.66rem;font-weight:640;letter-spacing:.03em;text-transform:uppercase;
  padding:5px 11px;border-radius:var(--pill)}
.plan .per{font-size:.84rem;color:var(--txt-3);font-weight:500}
.plan .amt{font-size:clamp(2.1rem,1.4vw + 1.8rem,2.6rem);font-weight:700;letter-spacing:-.04em;
  line-height:1;margin:10px 0 4px}
.plan .mo{font-size:.86rem;color:var(--txt-2);margin-bottom:20px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:22px;flex:1}
.plan li{display:flex;gap:9px;font-size:.92rem;color:var(--txt-2);align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--blue);flex:0 0 auto;margin-top:3px}
.plan .btn{width:100%;min-height:46px;font-size:.97rem}
.pay-note{text-align:center;margin-top:26px;color:var(--txt-3);font-size:.88rem}

/* ── Пробный доступ ── */
.trial{background:linear-gradient(158deg,rgba(10,132,255,.22),rgba(94,92,230,.12) 55%,var(--card) 100%);
  border-radius:var(--r-xl);padding:clamp(24px,3.6vw,44px)}
.trial-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
  gap:clamp(24px,3.4vw,44px);align-items:center}
.trial h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin-bottom:14px}
.trial .lead{max-width:100%;font-size:1.02rem}
.steps{display:flex;flex-direction:column;gap:15px;margin-top:24px}
.step{display:flex;gap:13px;align-items:flex-start}
.step b{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.77rem;font-weight:640}
.step p{font-size:.95rem;color:var(--txt-2);padding-top:2px}
.key-lbl{font-size:.8rem;font-weight:590;letter-spacing:.02em;text-transform:uppercase;
  color:var(--txt-3);margin-bottom:10px}
/* Плашка ключа: в приложении копирование выглядит так же */
.field{background:rgba(0,0,0,.45);border-radius:var(--r-card);padding:14px 14px 14px 18px;
  display:flex;align-items:center;gap:12px;cursor:pointer}
.field code{font-family:var(--mono);font-size:clamp(.7rem,.35vw + .62rem,.78rem);color:#6FB6FF;
  overflow-wrap:anywhere;flex:1;line-height:1.5;min-width:0}
.copy{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.copy:active{transform:scale(.92)}
.copy svg{width:18px;height:18px}
.apps{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.apps a{font-size:.88rem;color:var(--txt);background:var(--card-2);padding:11px 18px;
  border-radius:var(--pill);min-height:44px;display:inline-flex;align-items:center;transition:background-color .2s}
.apps a:hover{background:var(--card-3)}
.key-note{font-size:.85rem;color:var(--txt-3);margin-top:14px;line-height:1.45}

/* ── Установка ── */
.os-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(12px,1.4vw,18px)}
.os{background:var(--card);border-radius:var(--r-lg);padding:clamp(24px,2.6vw,32px)}
.os h3{margin-bottom:4px}
.os .rec{font-size:.86rem;color:var(--blue);font-weight:510;margin-bottom:20px}
.os ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
.os li{counter-increment:s;position:relative;padding-left:34px;font-size:.94rem;color:var(--txt-2)}
.os li::before{content:counter(s);position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;
  background:var(--card-2);font-size:.74rem;font-weight:640;color:var(--txt);
  display:flex;align-items:center;justify-content:center}

/* ── Вопросы: раскрывающиеся строки списка ── */
.faq{max-width:760px;margin-inline:auto;background:var(--card);border-radius:var(--r-card);overflow:hidden}
.faq details + details{border-top:.5px solid var(--sep)}
.faq summary{padding:17px 20px;font-size:1rem;font-weight:510;letter-spacing:-.018em;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:8px;height:8px;flex:0 0 auto;
  border-right:2px solid var(--txt-3);border-bottom:2px solid var(--txt-3);
  transform:rotate(45deg);transition:transform .28s;margin-top:-3px}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.faq details p{padding:0 20px 18px;color:var(--txt-2);font-size:.94rem;line-height:1.5}

/* ── Отзывы (заполняется автоматически) ── */
.rating-hero{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:28px}
.rating-hero .big{font-size:clamp(2.8rem,6vw,3.6rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.rating-hero .stars{color:var(--orange);font-size:1.2rem;letter-spacing:.1em}
.rating-hero .cnt{color:var(--txt-3);font-size:.88rem;margin-top:4px}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,262px),1fr));gap:12px}
.rev-card{background:var(--card);border-radius:var(--r-card);padding:20px}
.rev-card .s{color:var(--orange);font-size:.92rem;letter-spacing:.08em}
.rev-card p{margin-top:9px;color:var(--txt-2);font-size:.93rem;line-height:1.45}
.rev-card .who{margin-top:12px;font-size:.82rem;color:var(--txt-3)}

/* ── Финальный призыв ── */
.final{text-align:center;background:linear-gradient(158deg,rgba(10,132,255,.24),rgba(94,92,230,.14) 55%,var(--card));
  border-radius:var(--r-xl);padding:clamp(36px,5.6vw,72px) clamp(22px,4vw,48px)}
.final h2{margin-bottom:14px}
.final .lead{margin:0 auto 30px;max-width:40ch}

/* ── Подвал ── */
footer{border-top:.5px solid var(--sep);padding-block:clamp(38px,4.6vw,56px)
  calc(clamp(26px,3vw,34px) + env(safe-area-inset-bottom));font-size:.88rem}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(24px,3vw,40px)}
.foot h3{font-size:.85rem;font-weight:590;color:var(--txt);margin-bottom:13px;letter-spacing:-.01em}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.foot ul a{color:var(--txt-2);display:inline-block;padding-block:11px;transition:color .2s}
/* Почта в подвале — такая же область нажатия, как у остальных ссылок */
.foot p a{display:inline-block;padding-block:10px}
.foot ul a:hover{color:var(--txt)}
.foot p{color:var(--txt-2);margin-bottom:8px;line-height:1.5}
.foot .brand{margin-bottom:14px}
.copy-line{margin-top:clamp(28px,4vw,42px);padding-top:22px;border-top:.5px solid var(--sep);
  color:var(--txt-3);font-size:.82rem;display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:space-between}

/* ── Модальное окно документа ── */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .3s}
.modal.show{display:flex;opacity:1}
.modal-in{background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:760px;
  max-height:min(88dvh,940px);overflow-y:auto;overscroll-behavior:contain;
  padding:12px clamp(20px,3vw,34px) calc(clamp(24px,3vw,34px) + env(safe-area-inset-bottom));
  position:relative;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.25,1)}
.modal.show .modal-in{transform:none}
/* Полоска-«ручка» вверху — привычный признак шторки в iOS */
.modal-in::before{content:"";display:block;width:38px;height:5px;border-radius:99px;
  background:var(--card-3);margin:0 auto 18px;position:sticky;top:0}
.modal-in h3{font-size:clamp(1.3rem,2.4vw,1.6rem);margin-bottom:16px;padding-right:46px}
.modal-in .body{white-space:pre-line;color:var(--txt-2);font-size:.94rem;line-height:1.62}
.x-modal{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--card-3);color:var(--txt-2);display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;cursor:pointer;transition:background-color .2s}
.x-modal:hover{background:#48484A;color:var(--txt)}

/* ── Всплывающее уведомление и кнопка «наверх» ── */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);background:var(--card-3);color:var(--txt);
  padding:13px 24px;border-radius:var(--pill);font-size:.93rem;font-weight:510;z-index:400;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  max-width:calc(100vw - 32px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%)}
.up{position:fixed;right:max(18px,env(safe-area-inset-right));
  bottom:calc(18px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:80;
  background:rgba(44,44,46,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  color:var(--txt);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.up.show{opacity:1;visibility:visible}

/* ═══ Появление первого экрана ═══
   Только здесь и только по времени: такая анимация гарантированно
   доигрывает до конца, в отличие от привязки к прокрутке. */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .hero > *,.device-wrap{animation:rise .7s cubic-bezier(.2,.7,.3,1) backwards}
  .hero > :nth-child(2){animation-delay:.05s}
  .hero > :nth-child(3){animation-delay:.1s}
  .hero > :nth-child(4){animation-delay:.15s}
  .device-wrap{animation-delay:.2s}
}

/* ═══ Адаптивность ═══ */
@media (min-width:1600px){ :root{--maxw:1180px} }

  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
@media (prefers-contrast:more){
  :root{--txt-2:rgba(235,235,245,.85);--txt-3:rgba(235,235,245,.75);--sep:rgba(160,160,168,.8)}

}
