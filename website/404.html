<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="robots" content="noindex, follow">
<title>Страница не найдена — Gigabyte VPN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300E5C0'/%3E%3Cpath d='M54 20 30 56h16l-4 24 26-38H50z' fill='%2306070B'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Gigabyte VPN — оформление сайта.

   Три правила, на которых всё держится:
   1. Контент виден всегда. Появление блоков — украшение на чистом CSS;
      если скрипты не отработают, страница остаётся полностью читаемой.
   2. Размеры текучие (clamp / auto-fit) — от 320 px до 4K без ступенек
      и без горизонтальной прокрутки.
   3. Ничего внешнего: шрифты системные, графика — inline SVG. Это держит
      строгую политику безопасности и убирает лишние запросы.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;

  /* фон и поверхности */
  --bg:#05060A;
  --bg-2:#080A11;
  --line:rgba(255,255,255,.075);
  --edge:rgba(255,255,255,.13);

  /* текст — все три уровня проходят WCAG AA на основном фоне */
  --txt:#EDF1F8;
  --txt2:#A2ABBD;
  --txt3:#8B93A5;

  /* акценты */
  --acc:#00E5C0;
  --acc-2:#37C8FF;
  --acc-3:#4D8DFF;
  --acc-4:#B76BFF;
  --on-acc:#02120E;

  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* ритм и форма */
  --pill:999px;
  --r-xl:34px;
  --r:26px;
  --r-s:18px;
  --maxw:1240px;
  --pad:clamp(18px,4.2vw,34px);
  --sec:clamp(62px,8.5vw,120px);
  --gap:clamp(14px,1.6vw,20px);

  --shadow:0 30px 80px -34px rgba(0,0,0,.9);
  --hi:inset 0 1px 0 rgba(255,255,255,.09);
  --ring:0 0 0 3px rgba(0,229,192,.4);
  --nav-h:68px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{
  background:var(--bg);
  min-height:100%;
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--sans);
  font-size:clamp(15.5px,.4vw + 14.6px,17px);
  line-height:1.62;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-height:100dvh;
  overflow-x:clip;
}
body.lock{overflow:hidden}
img,svg,canvas{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none}
::selection{background:var(--acc);color:var(--on-acc)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:content-box}

/* видимый фокус с клавиатуры — без него сайт непроходим без мыши */
:focus-visible{outline:none;box-shadow:var(--ring)}
a:focus-visible,button:focus-visible,summary:focus-visible{border-radius:12px}

/* ─────────────────────────── фон ─────────────────────────── */
/* Три размытых пятна вместо картинки: дают глубину и «живой» свет,
   двигаются только через transform — это не нагружает раскладку. */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.aura i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.aura .a1{width:60vw;height:60vw;max-width:820px;max-height:820px;top:-24vw;left:-10vw;
  background:radial-gradient(circle,rgba(0,229,192,.42),transparent 68%);animation:drift1 34s ease-in-out infinite}
.aura .a2{width:52vw;height:52vw;max-width:700px;max-height:700px;top:-8vw;right:-14vw;
  background:radial-gradient(circle,rgba(77,141,255,.36),transparent 68%);animation:drift2 42s ease-in-out infinite}
.aura .a3{width:46vw;height:46vw;max-width:620px;max-height:620px;top:34vh;left:38vw;
  background:radial-gradient(circle,rgba(183,107,255,.24),transparent 70%);animation:drift3 52s ease-in-out infinite}
@keyframes drift1{50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
@keyframes drift2{50%{transform:translate3d(-7vw,7vh,0) scale(1.08)}}
@keyframes drift3{50%{transform:translate3d(-5vw,-6vh,0) scale(1.14)}}

/* сетка узлов — «дышащая» инфраструктура; canvas не растягивается
   свойством inset, поэтому размеры заданы явно */
#net{position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:1;pointer-events:none;opacity:.5}

/* затемнение по краям, чтобы фон не спорил с текстом */
.vign{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 92% 58% at 50% 0%,transparent 26%,rgba(5,6,10,.72) 66%,var(--bg) 88%),
    linear-gradient(180deg,transparent 60%,var(--bg) 100%)}

/* мельчайшее зерно — убирает «пластиковость» градиентов */
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.032;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  background-size:140px 140px}

/* ─────────────────────── каркас и типографика ─────────────────────── */
.wrap{max-width:var(--maxw);margin-inline:auto;position:relative;z-index:5;
  padding-inline:max(var(--pad),env(safe-area-inset-left),env(safe-area-inset-right))}
section{padding-block:var(--sec);position:relative;scroll-margin-top:calc(var(--nav-h) + 12px)}
main{position:relative;z-index:5}

h1,h2,h3,h4{line-height:1.06;letter-spacing:-.032em;font-weight:800;text-wrap:balance}
h1{font-size:clamp(2.35rem,7.4vw,4.6rem)}
h2{font-size:clamp(1.75rem,4.4vw,2.95rem)}
p{text-wrap:pretty}

.lead{color:var(--txt2);font-size:clamp(1rem,.5vw + .92rem,1.16rem);max-width:64ch}
.grad{background:linear-gradient(104deg,var(--acc) 4%,var(--acc-2) 38%,var(--acc-3) 66%,var(--acc-4));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  /* курсивные хвосты букв иначе срезаются градиентной маской */
  padding-inline-end:.06em}

.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:clamp(.68rem,.2vw + .64rem,.76rem);letter-spacing:.15em;text-transform:uppercase;
  color:var(--acc);border:1px solid rgba(0,229,192,.28);background:rgba(0,229,192,.07);
  padding:7px 15px;border-radius:var(--pill);white-space:nowrap}

.sec-head{max-width:min(760px,100%);margin-bottom:clamp(32px,4.4vw,54px)}
.sec-head h2{margin:16px 0 14px}
.sec-head.mid{text-align:center;margin-inline:auto}
.sec-head.mid .lead{margin-inline:auto}

/* ─────────────────────────── стекло ─────────────────────────── */
/* Грань рисуется градиентом по рамке: сверху светлее, снизу гаснет —
   так поверхность читается объёмной, а не просто полупрозрачной. */
.glass,
.card,.plan,.route,.os,.status,.post,.rev-card,.doc,.trial,.final,
.faq details{
  border:1px solid transparent;
  background:
    linear-gradient(178deg,rgba(255,255,255,.062),rgba(255,255,255,.022)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.20),rgba(255,255,255,.045) 42%,rgba(255,255,255,.13)) border-box;
  -webkit-backdrop-filter:blur(24px) saturate(1.65);
  backdrop-filter:blur(24px) saturate(1.65);
  box-shadow:var(--hi),var(--shadow);
}
/* Если размытия фона нет (старые браузеры) — подставляем плотную заливку,
   иначе полупрозрачные карточки сливаются с фоном и текст плывёт. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.card,.plan,.route,.os,.status,.post,.rev-card,.doc,
  .faq details{background:linear-gradient(178deg,#11141D,#0B0E15) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 42%,rgba(255,255,255,.13)) border-box}
}

/* ─────────────────────────── кнопки ─────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:650;font-size:clamp(.94rem,.2vw + .9rem,1rem);line-height:1.2;
  min-height:50px;padding:14px 28px;border-radius:var(--pill);border:1px solid transparent;
  cursor:pointer;position:relative;overflow:hidden;white-space:nowrap;
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,background-color .22s,border-color .22s}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn:active{transform:translateY(1px) scale(.99)}

.b-main{background:linear-gradient(102deg,var(--acc),var(--acc-2));color:var(--on-acc);
  box-shadow:0 0 0 1px rgba(0,229,192,.45),0 14px 44px -14px rgba(0,229,192,.7)}
/* блик пробегает по кнопке при наведении — тонкий знак «премиум» */
.b-main::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.b-main:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,229,192,.65),0 22px 56px -14px rgba(0,229,192,.85)}
.b-main:hover::after{transform:translateX(120%)}

.b-ghost{color:var(--txt);border:1px solid transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07)) border-box;
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.b-ghost:hover{transform:translateY(-2px);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.1)) border-box}

/* ─────────────────────────── навигация ─────────────────────────── */
/* Полоса прогресса чтения — на CSS, без единой строки скрипта. */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:96;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--acc),var(--acc-3) 55%,var(--acc-4))}
@supports (animation-timeline:scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root block)}
}
@keyframes grow{to{transform:scaleX(1)}}

header.nav{position:fixed;top:0;left:0;right:0;z-index:95;padding-top:env(safe-area-inset-top);
  border-bottom:1px solid transparent;transition:background-color .3s,border-color .3s,backdrop-filter .3s}
header.nav.on{background:rgba(5,6,10,.74);border-bottom-color:var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7)}
.nav-in{max-width:var(--maxw);margin-inline:auto;min-height:var(--nav-h);
  padding:12px max(var(--pad),env(safe-area-inset-left)) 12px max(var(--pad),env(safe-area-inset-right));
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.06rem;letter-spacing:-.025em;flex:0 0 auto}
.brand .m{width:30px;height:30px;flex:0 0 auto}
.nav-l{display:flex;gap:2px;min-width:0}
.nav-l a{font-size:.9rem;color:var(--txt2);padding:9px 14px;border-radius:var(--pill);font-weight:500;
  transition:color .2s,background-color .2s;white-space:nowrap}
.nav-l a:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.nav-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.lang{display:flex;border-radius:var(--pill);overflow:hidden;border:1px solid var(--edge);
  background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lang button{color:var(--txt3);padding:8px 12px;cursor:pointer;font-family:var(--mono);
  font-size:.74rem;font-weight:600;transition:color .2s,background-color .2s}
.lang button:hover{color:var(--txt)}
.lang button.on{background:var(--acc);color:var(--on-acc)}

.burger{display:none;flex-direction:column;justify-content:center;gap:5px;
  width:46px;height:46px;align-items:center;border-radius:var(--pill);cursor:pointer;
  border:1px solid var(--edge);background:rgba(255,255,255,.05)}
.burger span{width:19px;height:2px;background:var(--txt);border-radius:2px;transition:transform .3s,opacity .3s}

.mob{position:fixed;inset:0;z-index:200;background:rgba(5,6,10,.97);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3.4vh,26px);padding:calc(env(safe-area-inset-top) + 76px) var(--pad) calc(env(safe-area-inset-bottom) + 28px);
  overflow-y:auto;visibility:hidden;opacity:0;transform:translateY(-14px);
  transition:opacity .32s ease,transform .32s cubic-bezier(.2,.7,.3,1),visibility 0s .32s}
.mob.open{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.mob a:not(.btn){font-size:clamp(1.2rem,5vw,1.5rem);font-weight:700}
.mob .btn{margin-top:8px}
.mob .x{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:var(--pad);
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--txt);font-size:1.4rem;cursor:pointer}

/* ─────────────────────────── первый экран ─────────────────────────── */
.hero{padding-top:calc(var(--nav-h) + env(safe-area-inset-top) + clamp(48px,11vh,110px));
  padding-bottom:clamp(44px,7vw,80px)}
.hero h1{max-width:15ch;margin:clamp(16px,2.4vw,26px) 0 clamp(14px,2vw,22px)}
.hero .lead{font-size:clamp(1.02rem,.6vw + .92rem,1.28rem)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:clamp(26px,3.6vw,38px)}
.hero-note{margin-top:16px;font-family:var(--mono);font-size:clamp(.74rem,.25vw + .7rem,.82rem);color:var(--txt3)}
.live{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(0,229,192,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,192,.5)}70%{box-shadow:0 0 0 9px rgba(0,229,192,0)}100%{box-shadow:0 0 0 0 rgba(0,229,192,0)}}

/* показатели: колонок ровно столько, сколько помещается */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
  margin-top:clamp(38px,5vw,64px);background:var(--line);border-radius:var(--r);overflow:hidden;
  border:1px solid transparent;
  background-image:linear-gradient(var(--line),var(--line)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.13)) border-box;
  box-shadow:var(--hi),var(--shadow)}
.kpi div{background:rgba(10,12,19,.55);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  backdrop-filter:blur(20px) saturate(1.6);padding:clamp(18px,2.4vw,26px) clamp(16px,2vw,22px)}
.kpi b{display:block;font-family:var(--mono);font-weight:800;letter-spacing:-.035em;
  font-size:clamp(1.5rem,3.2vw,2.25rem);
  background:linear-gradient(160deg,#fff,#B8C2D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font-size:clamp(.78rem,.25vw + .74rem,.85rem);color:var(--txt3);display:block;margin-top:4px}

/* ────────────────────── лента сервисов ────────────────────── */
/* Высота задана заранее и содержимое лежит в разметке — блок не «прыгает»
   после загрузки и индексируется поисковиками как обычный текст. */
.marq{position:relative;z-index:5;display:flex;align-items:center;overflow:hidden;
  height:clamp(74px,8.4vw,92px);border-block:1px solid var(--line);background:rgba(8,10,17,.6);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.marq-row{display:flex;gap:12px;width:max-content;padding-inline:6px;animation:slide 46s linear infinite}
.marq:hover .marq-row{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid var(--line);
  border-radius:var(--pill);font-size:clamp(.85rem,.25vw + .8rem,.92rem);color:var(--txt2);
  background:rgba(255,255,255,.03);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);flex:0 0 auto;opacity:.85}

/* ─────────────────────────── карточки ─────────────────────────── */
.grid{display:grid;gap:var(--gap)}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,282px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}

.card{border-radius:var(--r);padding:clamp(22px,2.6vw,30px);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s}
/* мягкое свечение под курсором: координаты ставит скрипт, но без него
   карточка просто остаётся обычной — ничего не ломается */
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;
  transition:opacity .35s;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(0,229,192,.14),transparent 62%)}
.card:hover{transform:translateY(-4px);box-shadow:var(--hi),0 34px 80px -34px rgba(0,229,192,.34)}
.card:hover::before{opacity:1}
.card .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;background:rgba(0,229,192,.1);border:1px solid rgba(0,229,192,.24)}
.card .ic svg{width:22px;height:22px;color:var(--acc)}
.card h3{font-size:clamp(1.1rem,.5vw + 1rem,1.24rem);margin-bottom:9px;font-weight:700;letter-spacing:-.02em}
.card p{color:var(--txt2);font-size:clamp(.92rem,.25vw + .88rem,.97rem)}
/* подпись-«техничка» всегда прижата к низу карточки — так строки
   выравниваются между собой при разной длине текста */
.card .mono{font-family:var(--mono);font-size:.77rem;color:var(--txt3);display:block;
  margin-top:auto;padding-top:16px;word-break:break-word}

/* ────────────────────── схема маршрутизации ────────────────────── */
.route{border-radius:var(--r);padding:clamp(22px,3vw,34px)}
.route-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--mono);
  font-size:clamp(.8rem,.3vw + .74rem,.88rem)}
.route-row + .route-row{margin-top:14px}
.node{padding:10px 18px;border:1px solid var(--edge);border-radius:var(--pill);
  background:rgba(255,255,255,.05)}
.node.hi{border-color:rgba(0,229,192,.42);color:var(--acc);background:rgba(0,229,192,.08)}
.arrow{color:var(--txt3);flex:0 0 auto}
.route > p{margin-top:18px;color:var(--txt2);font-size:clamp(.9rem,.25vw + .86rem,.96rem)}

/* ─────────────────────────── тарифы ─────────────────────────── */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,218px),1fr));gap:var(--gap)}
.plan{position:relative;border-radius:var(--r);padding:clamp(22px,2.4vw,28px);display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s}
.plan:hover{transform:translateY(-5px)}
.plan.best{background:
    linear-gradient(178deg,rgba(0,229,192,.13),rgba(255,255,255,.028) 52%) padding-box,
    linear-gradient(160deg,rgba(0,229,192,.62),rgba(0,229,192,.14) 48%,rgba(255,255,255,.12)) border-box;
  box-shadow:var(--hi),0 34px 80px -34px rgba(0,229,192,.45)}
/* запас сверху одинаковый у всех карточек, чтобы цены стояли на одной линии */
.plans .plan{padding-top:calc(clamp(22px,2.4vw,28px) + 14px)}
.plan .lbl{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.plan .best-tag{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:.63rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--on-acc);background:var(--acc);
  padding:5px 12px;border-radius:var(--pill);box-shadow:0 8px 24px -10px rgba(0,229,192,.9)}
.plan .amt{font-family:var(--mono);font-size:clamp(2rem,1.4vw + 1.7rem,2.5rem);font-weight:800;
  letter-spacing:-.04em;margin:8px 0 2px;line-height:1}
.plan .per{font-size:.83rem;color:var(--txt3);margin-bottom:20px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:22px;flex:1}
.plan li{display:flex;gap:9px;font-size:.92rem;color:var(--txt2)}
.plan li svg{width:16px;height:16px;color:var(--acc);flex:0 0 auto;margin-top:4px}
.plan .btn{width:100%}
.pay-note{text-align:center;margin-top:26px;color:var(--txt3);font-family:var(--mono);
  font-size:clamp(.79rem,.25vw + .75rem,.9rem)}

/* ─────────────────────── пробный доступ ─────────────────────── */
.trial{border-radius:var(--r-xl);padding:clamp(22px,3.4vw,40px);
  background:
    linear-gradient(140deg,rgba(0,229,192,.13),rgba(77,141,255,.07) 52%,rgba(183,107,255,.06)) padding-box,
    linear-gradient(160deg,rgba(0,229,192,.5),rgba(255,255,255,.07) 46%,rgba(77,141,255,.34)) border-box}
.trial-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,304px),1fr));
  gap:clamp(24px,3.4vw,40px);align-items:center}
.trial h2{margin:16px 0 14px;font-size:clamp(1.55rem,3.4vw,2.3rem)}
.trial .lead{font-size:clamp(.98rem,.3vw + .92rem,1.04rem)}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.step{display:flex;gap:14px}
.step b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-family:var(--mono)}
.step p{font-size:clamp(.9rem,.25vw + .86rem,.96rem);color:var(--txt2)}
.key-lbl{font-family:var(--mono);font-size:.73rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:10px}
.field{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--edge);border-radius:var(--r);padding:12px 12px 12px 20px;
  display:flex;align-items:center;gap:12px}
.field code{font-family:var(--mono);font-size:clamp(.68rem,.35vw + .6rem,.77rem);color:var(--acc);
  overflow-wrap:anywhere;flex:1;line-height:1.55;min-width:0}
.copy{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--on-acc);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
.copy:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(0,229,192,.9)}
.copy svg{width:18px;height:18px}
.apps{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.apps a{font-size:.85rem;color:var(--txt2);border:1px solid var(--edge);padding:10px 18px;
  border-radius:var(--pill);background:rgba(255,255,255,.05);transition:color .2s,border-color .2s}
.apps a:hover{border-color:rgba(0,229,192,.4);color:var(--txt)}
.key-note{font-size:.83rem;color:var(--txt3);margin-top:14px}

/* ─────────────────────────── установка ─────────────────────────── */
.os{border-radius:var(--r);padding:clamp(22px,2.6vw,30px)}
.os h3{font-size:clamp(1.08rem,.5vw + 1rem,1.2rem);margin-bottom:4px}
.os .rec{font-family:var(--mono);font-size:.79rem;color:var(--acc);margin-bottom:18px}
.os ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.os li{counter-increment:s;position:relative;padding-left:36px;
  font-size:clamp(.9rem,.25vw + .86rem,.95rem);color:var(--txt2)}
.os li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid var(--line);font-family:var(--mono);font-size:.73rem;
  display:flex;align-items:center;justify-content:center;color:var(--acc)}

/* ─────────────────────────── вопросы ─────────────────────────── */
.faq{max-width:840px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.faq details{border-radius:var(--r);padding-inline:clamp(18px,2.2vw,26px)}
.faq details[open]{background:
    linear-gradient(178deg,rgba(0,229,192,.07),rgba(255,255,255,.022)) padding-box,
    linear-gradient(160deg,rgba(0,229,192,.4),rgba(255,255,255,.06) 50%,rgba(255,255,255,.12)) border-box}
.faq summary{padding:19px 0;font-weight:650;font-size:clamp(.97rem,.3vw + .92rem,1.04rem);cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:9px;height:9px;flex:0 0 auto;margin-top:-4px;
  border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);
  transform:rotate(45deg);transition:transform .28s,margin .28s}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.faq details p{padding:0 0 20px;color:var(--txt2);font-size:clamp(.9rem,.25vw + .86rem,.96rem)}

/* ────────────────────── состояние сети ────────────────────── */
.status{border-radius:var(--r);padding:4px clamp(18px,2.6vw,30px);max-width:740px;margin-inline:auto}
.srv{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 0;
  border-bottom:1px solid var(--line);font-size:clamp(.9rem,.25vw + .86rem,.97rem)}
.srv:last-child{border-bottom:none}
.srv .ok{display:inline-flex;align-items:center;gap:8px;color:var(--acc);font-family:var(--mono);font-size:.83rem}
.srv .soon{color:var(--txt3);font-family:var(--mono);font-size:.83rem;white-space:nowrap}

/* ─────────────────────────── журнал ─────────────────────────── */
.post{border-radius:var(--r);padding:clamp(20px,2.4vw,26px);
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s}
.post:hover{transform:translateY(-4px);box-shadow:var(--hi),0 30px 70px -34px rgba(0,229,192,.3)}
.post time{font-family:var(--mono);font-size:.75rem;color:var(--acc)}
.post h3{font-size:clamp(1.02rem,.4vw + .96rem,1.12rem);margin:10px 0;font-weight:700}
.post p{font-size:clamp(.88rem,.25vw + .84rem,.93rem);color:var(--txt2)}

/* ─────────────────────────── отзывы ─────────────────────────── */
.rating-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.rating-hero .big{font-family:var(--mono);font-size:clamp(2.6rem,6vw,3.4rem);font-weight:800;
  letter-spacing:-.04em;line-height:1}
.rating-hero .stars{color:var(--acc);font-size:1.25rem;letter-spacing:.12em}
.rating-hero .cnt{color:var(--txt3);font-size:.89rem}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:var(--gap)}
.rev-card{border-radius:var(--r);padding:clamp(20px,2.4vw,26px)}
.rev-card .s{color:var(--acc);font-size:.95rem;letter-spacing:.1em}
.rev-card p{margin-top:10px;color:var(--txt2);font-size:.94rem}
.rev-card .who{margin-top:14px;font-size:.84rem;color:var(--txt3);font-family:var(--mono)}

/* ─────────────────────────── документы ─────────────────────────── */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,244px),1fr));gap:var(--gap)}
.doc{border-radius:var(--r);padding:22px;cursor:pointer;display:flex;align-items:center;gap:14px;
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s}
.doc:hover{transform:translateY(-3px);box-shadow:var(--hi),0 26px 60px -32px rgba(0,229,192,.34)}
.doc .ic{width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:rgba(0,229,192,.1);border:1px solid rgba(0,229,192,.24)}
.doc .ic svg{width:20px;height:20px;color:var(--acc)}
.doc h3{font-size:clamp(.94rem,.3vw + .9rem,1rem);font-weight:650;letter-spacing:-.015em}

/* ────────────────────── финальный призыв ────────────────────── */
.final{border-radius:var(--r-xl);padding:clamp(30px,5vw,60px) clamp(22px,4vw,44px);text-align:center;
  background:
    linear-gradient(140deg,rgba(0,229,192,.14),rgba(77,141,255,.08) 50%,rgba(183,107,255,.1)) padding-box,
    linear-gradient(160deg,rgba(0,229,192,.5),rgba(255,255,255,.07) 46%,rgba(183,107,255,.4)) border-box}
.final h2{margin-bottom:14px}
.final .lead{margin:0 auto 28px}

/* ─────────────────────────── подвал ─────────────────────────── */
footer{position:relative;z-index:5;border-top:1px solid var(--line);background:var(--bg-2);
  padding-block:clamp(40px,5vw,58px) calc(clamp(26px,3vw,34px) + env(safe-area-inset-bottom))}
.foot{display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(130px,1fr));
  gap:clamp(24px,3vw,38px)}
.foot p{color:var(--txt2);font-size:.89rem;margin-bottom:6px}
.foot h3{font-family:var(--mono);font-size:.73rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:14px;font-weight:600;line-height:1.4}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.foot ul a{color:var(--txt2);font-size:.89rem;transition:color .2s}
.foot ul a:hover{color:var(--acc)}
.foot .tg{color:var(--acc)}
.foot .brand{margin-bottom:14px}
.copy-line{margin-top:clamp(30px,4vw,42px);padding-top:24px;border-top:1px solid var(--line);
  text-align:center;color:var(--txt3);font-size:.81rem;font-family:var(--mono)}

/* ─────────────────────────── окно документа ─────────────────────────── */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:rgba(3,4,7,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .28s}
.modal.show{display:flex;opacity:1}
.modal-in{background:rgba(14,16,24,.9);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--edge);border-radius:var(--r-xl);
  max-width:860px;width:100%;max-height:min(86dvh,900px);overflow-y:auto;overscroll-behavior:contain;
  padding:clamp(24px,3.4vw,38px);position:relative;transform:translateY(14px) scale(.99);
  transition:transform .32s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow)}
.modal.show .modal-in{transform:none}
.modal-in h3{font-size:clamp(1.22rem,2.4vw,1.45rem);margin-bottom:18px;padding-right:52px}
.modal-in .body{white-space:pre-line;color:var(--txt2);font-size:clamp(.89rem,.25vw + .85rem,.94rem);line-height:1.75}
.x-modal{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);
  border:1px solid var(--line);color:var(--txt);font-size:1.3rem;cursor:pointer;transition:.2s}
.x-modal:hover{background:var(--acc);color:var(--on-acc)}

/* ─────────────────────── мелкие плавающие элементы ─────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px);background:var(--acc);color:var(--on-acc);
  padding:13px 26px;border-radius:var(--pill);font-weight:650;font-size:.92rem;z-index:400;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.up{position:fixed;right:max(20px,env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:80;
  background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--txt);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s,color .2s,border-color .2s}
.up.show{opacity:1;visibility:visible}
.up:hover{border-color:rgba(0,229,192,.45);color:var(--acc)}

/* ═══════════════ появление блоков ═══════════════
   ГЛАВНОЕ ПРАВИЛО ЭТОГО ФАЙЛА: ни один блок страницы не имеет
   opacity:0 в обычном состоянии. Однажды сайт уже уходил в чёрный
   экран, потому что показ контента зависел от того, отработает ли
   что-то асинхронное (сначала — скрипт, потом — анимация по прокрутке).
   Больше такой зависимости нет: всё содержимое видно сразу и всегда.

   Оживает страница другим: подсветка фона, сетка узлов, лента сервисов,
   полоса прочитанного, отклик карточек и кнопок на курсор. Единственная
   анимация появления — на первом экране, и она привязана ко времени,
   то есть гарантированно доигрывает до конца. */
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:no-preference){
  .hero > *{animation:heroIn .68s cubic-bezier(.2,.7,.3,1) backwards}
  .hero > :nth-child(2){animation-delay:.06s}
  .hero > :nth-child(3){animation-delay:.12s}
  .hero > :nth-child(4){animation-delay:.18s}
  .hero > :nth-child(5){animation-delay:.24s}
  .hero > :nth-child(6){animation-delay:.3s}
}

@media print{
  .hero > *{animation:none!important;opacity:1!important;transform:none!important}
  .aura,.grain,.vign,#net,.progress,.up,header.nav{display:none!important}
  body{background:#fff;color:#000}
  .card,.plan,.route,.os,.status,.post,.rev-card,.doc,.trial,.final,.faq details{
    background:none!important;border:1px solid #ccc!important;box-shadow:none!important}
}
@media (forced-colors:active){
  .hero > *{animation:none!important;opacity:1!important;transform:none!important}
}

/* ═══════════════ размер областей нажатия ═══════════════
   На телефоне палец попадает примерно в 44 px. Меньше — промахи,
   поэтому у всех ссылок и кнопок высота доведена до этой величины. */
.lang button{min-height:42px}
.nav-l a{min-height:40px;display:inline-flex;align-items:center}
.brand{padding-block:7px}
.mob a:not(.btn){padding:10px 18px;border-radius:var(--pill)}
.mob a:not(.btn):hover{background:rgba(255,255,255,.06)}
.apps a{min-height:44px;display:inline-flex;align-items:center}
.foot ul{gap:2px}
.foot ul a{display:inline-block;padding-block:11px}
.foot .tg{display:inline-block;padding-block:11px}
.srv{min-height:56px}

/* ═══════════════ адаптивность ═══════════════ */

/* очень широкие экраны — даём воздуху развернуться */
@media (min-width:1720px){
  :root{--maxw:1360px}
  body{font-size:17.5px}
}

/* планшеты в альбоме: меню целиком не помещается */
@media (max-width:1080px){
  .nav-l a{padding:9px 11px;font-size:.86rem}
}
@media (max-width:900px){
  .nav-l{display:none}
  .burger{display:flex}
  .nav-r .btn{padding:12px 20px;min-height:46px}
}

/* телефоны */
@media (max-width:560px){
  :root{--r-xl:26px;--r:22px}
  .nav-r .btn{display:none}
  .brand{font-size:1rem}
  .hero h1{max-width:100%}
  .cta{gap:10px}
  .cta .btn{width:100%}
  .route-row{gap:9px}
  /* стрелки разворачиваем вниз — цепочка читается сверху вниз */
  .arrow{transform:rotate(90deg);width:100%;text-align:center;line-height:1}
  .route-row{flex-direction:column;align-items:stretch;text-align:center}
  .field{padding:12px;flex-direction:column;align-items:stretch;gap:10px}
  .field .copy{align-self:flex-end}
  .foot{grid-template-columns:1fr;text-align:center}
  .foot ul{align-items:center}
  .foot .brand{justify-content:center}
  .srv{font-size:.9rem}
}

/* очень узкие экраны (320–380 px) */
@media (max-width:380px){
  :root{--pad:15px}
  .tag{font-size:.64rem;padding:6px 12px}
  .apps a{width:100%;text-align:center}
}

/* телефон в альбомной ориентации — экономим высоту */
@media (max-height:520px) and (orientation:landscape){
  .hero{padding-top:calc(var(--nav-h) + 26px);padding-bottom:34px}
  .mob{gap:10px;justify-content:flex-start}
  .mob a:not(.btn){font-size:1.05rem}
}

/* уважение к системным настройкам */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .aura i{animation:none}
  .marq-row{animation:none}
}
@media (prefers-contrast:more){
  :root{--txt2:#C6CEDC;--txt3:#AEB6C6;--line:rgba(255,255,255,.16);--edge:rgba(255,255,255,.28)}
}
</style>

    line-height:1;background:linear-gradient(104deg,var(--acc),var(--acc-3) 60%,var(--acc-4));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .nf h1{font-size:clamp(1.5rem,5vw,2.2rem);margin-top:14px}

</style>
</head>
