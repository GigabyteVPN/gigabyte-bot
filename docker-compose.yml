services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    networks:
      - internal
    volumes:
      # SSH-ключ и скрипт провижининга нод (для «добавить ноду» из дашборда).
      # Только чтение: приватный ключ и скрипт монтируются, не пекутся в образ.
      - ./provisioning:/app/provisioning:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./instructions:/usr/share/nginx/html/instructions:ro
      - ./website:/usr/share/nginx/html/gigabytebot:ro
      - ./certbot-www:/var/www/certbot
    depends_on:
      - bot
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
