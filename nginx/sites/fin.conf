# Сайт Mini App «Финансы» для nginx VPN-бота (gigabyte-bot/nginx/sites/fin.conf).
# Требует:
#   1) DNS: A-запись fin.synapseairwa.com → IP сервера
#   2) Сертификат: certbot certonly --standalone -d fin.synapseairwa.com
#      (с pre/post-хуками stop/start nginx-контейнера), файлы копируются в ./certs/fin/
#   3) Контейнер fin-webapp подключён к сети gigabyte-bot_internal
#      (fin docker-compose: networks.edge.external → EDGE_NETWORK).

server {
    listen 80;
    server_name fin.synapseairwa.com;

    # Проверка Let's Encrypt (webroot) — без неё продление требовало бы
    # останавливать nginx (standalone), т.е. ронять все сайты на время выпуска.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fin.synapseairwa.com;

    ssl_certificate /etc/nginx/certs/fin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fin/privkey.pem;

    location / {
        proxy_pass http://fin-webapp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
