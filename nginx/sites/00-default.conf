# Глухой catch-all для чужих/пустых Host.
#
# Без него nginx отдаёт первый попавшийся vhost всем, кто стучится по IP —
# в логах за сутки было ~700 обращений сканеров (.env, .git/config, phpinfo.php,
# CGI-эксплойты). Теперь такие запросы обрываются без ответа (444) и не
# засоряют логи, а по HTTPS вообще не доходят до TLS-рукопожатия.
# Наши домены обслуживаются своими server-блоками и сюда не попадают.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # nginx 1.19.4+: рвём TLS-рукопожатие для неизвестного SNI, сертификат не нужен
    ssl_reject_handshake on;
}
