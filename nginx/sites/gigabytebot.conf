# Официальный сайт Gigabyte VPN — gigabytebot.com
# ЭТАП 1 (HTTP): отдаём сайт и ACME-челлендж. После выпуска TLS-сертификата
# заменяется на редирект 80→443 + серверный блок 443 (см. deploy-скрипт).

server {
    listen 80;
    listen [::]:80;
    server_name gigabytebot.com www.gigabytebot.com;

    # Проверка Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /usr/share/nginx/html/gigabytebot;
    index index.html;

    location = /robots.txt   { }
    location = /sitemap.xml  { }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
